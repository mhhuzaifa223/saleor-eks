apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-dashboard
  namespace: saleor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-dashboard
  template:
    metadata:
      labels:
        app: saleor-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/saleor/saleor-dashboard:3.23
          ports:
            - containerPort: 80
          volumeMounts:
            - name: dashboard-config
              mountPath: /app/dashboard/index.html
              subPath: index.html
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: dashboard-config
          configMap:
            name: saleor-dashboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-dashboard
  namespace: saleor
spec:
  selector:
    app: saleor-dashboard
  ports:
    - name: http
      port: 9000
      targetPort: 80
  type: ClusterIP