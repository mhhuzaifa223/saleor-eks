
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saleor-ingress
  namespace: saleor
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:482972685106:certificate/1910fbc2-1be2-431b-b637-29c6f0c572ef
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: dashboard.mhhuzaifa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saleor-dashboard
                port:
                  number: 9000
    - host: api.mhhuzaifa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saleor-api
                port:
                  number: 8000
