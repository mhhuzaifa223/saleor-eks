apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-api
  namespace: saleor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-api
  template:
    metadata:
      labels:
        app: saleor-api
    spec:
      containers:
        - name: api
          image: ghcr.io/saleor/saleor:3.23
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: ALLOWED_HOSTS
              value: "api.mhhuzaifa.com,localhost,127.0.0.1"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleor-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://saleoradmin:$(DB_PASSWORD)@saleor-postgres.cqbak4yiaywf.us-east-1.rds.amazonaws.com:5432/saleor?sslmode=require"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saleor-app-credentials
                  key: secret-key
            - name: CACHE_URL
              value: "redis://cache:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://cache:6379/0"
            - name: DEFAULT_CHANNEL_SLUG
              value: "default-channel"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-api
  namespace: saleor
spec:
  selector:
    app: saleor-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000