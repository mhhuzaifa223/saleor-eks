name: Saleor CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2

      - name: Lint Helm chart
        run: helm lint infrastructure/helm/saleor-stack

      - name: Render Kubernetes templates
        run: helm template saleor infrastructure/helm/saleor-stack --namespace saleor